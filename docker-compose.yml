version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storywriter-backend
    networks:
      - storywriter-net
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/storywriter.db
      - SECRET_KEY=CHANGE_THIS_TO_A_LONG_RANDOM_STRING
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: storywriter-frontend
    networks:
      - storywriter-net
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  storywriter-net:
    driver: bridge
